<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controller Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e2f;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #2a2a40;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        h2 { text-align: center; color: #00ffcc; }
        .status {
            padding: 10px;
            background: #3a3a5e;
            border-radius: 5px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        #log {
            background: #111;
            padding: 15px;
            border-radius: 5px;
            height: 250px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
            color: #00ff00;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Controller Dashboard</h2>
        <div class="status" id="connectionStatus">Status: Menghubungkan ke Server...</div>
        <h3>Live Log / Data Masuk:</h3>
        <div id="log"></div>
    </div>

    <!-- KODE WEBSOCKET CONTROLLER YANG SUDAH TERPASANG -->
    <script>
        const statusDiv = document.getElementById('connectionStatus');
        const logDiv = document.getElementById('log');

        function appendLog(message) {
            const time = new Date().toLocaleTimeString();
            logDiv.innerHTML += `[${time}] ${message}<br>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        const ws = new WebSocket('wss://ws-server-production-a22d.up.railway.app/?role=controller');

        ws.onopen = () => {
            statusDiv.innerText = 'Status: Terhubung ke Server (Online)';
            statusDiv.style.color = '#00ff00';
            appendLog('Controller berhasil terhubung.');
        };

        ws.onmessage = (event) => {
            appendLog('Pesan masuk: ' + event.data);
            try {
                const data = JSON.parse(event.data);
                // Tambahan aksi jika data berupa JSON dari target
            } catch (e) {
                // Kalau formatnya bukan JSON, tetap tampilkan teks mentahnya
            }
        };

        ws.onclose = () => {
            statusDiv.innerText = 'Status: Terputus dari Server';
            statusDiv.style.color = '#ff4d4d';
            appendLog('Koneksi terputus.');
        };

        ws.onerror = (error) => {
            appendLog('Error koneksi WebSocket.');
        };
    </script>

</body>
</html>
